[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atlas-backend"
version = "0.1.0"
description = "Code Atlas repository intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=0.3,<1",
  "pathspec>=0.12,<1",
  "pydantic-settings>=2.6,<3",
  "langchain-core>=0.3,<1",
  "langchain-community>=0.3,<0.4",
  "langchain-huggingface>=0.1,<1",
  "sentence-transformers>=3.3,<6",
  "tree-sitter-language-pack>=0.9,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
  "live: uses real GitHub, Gemini, and Supabase integrations",
]

[tool.setuptools.packages.find]
include = ["app*"]
